<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Mynoo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --bg-card:     #1a1d27;
      --bg-card2:    #22263a;
      --border:      #2e3347;
      --text:        #e8eaf6;
      --text-muted:  #7b8094;
      --text-dim:    #4a4f6a;
      --accent:      #6c63ff;
      --accent-glow: rgba(108,99,255,.25);
      --green:       #2ecc71;
      --green-bg:    rgba(46,204,113,.12);
      --yellow:      #f39c12;
      --yellow-bg:   rgba(243,156,18,.12);
      --red:         #e74c3c;
      --red-bg:      rgba(231,76,60,.12);
      --radius:      14px;
      --radius-sm:   8px;
      --shadow:      0 4px 24px rgba(0,0,0,.4);
      --shadow-lg:   0 8px 48px rgba(0,0,0,.6);
      --transition:  all .2s ease;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ─── Topbar ─── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      padding: 0 24px;
      height: 60px;
      background: rgba(15,17,23,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.5px;
    }
    .topbar-sep { color: var(--border); margin: 0 4px; }
    .topbar-breadcrumb {
      color: var(--text-muted);
      font-size: .9rem;
    }
    .topbar-breadcrumb a { color: var(--accent); }
    .topbar-breadcrumb a:hover { text-decoration: underline; }
    .topbar-right { margin-left: auto; }

    /* ─── Container ─── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ─── Page header ─── */
    .page-header { margin-bottom: 32px; }
    .page-header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -.5px;
    }
    .page-header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: .95rem;
    }

    /* ─── Cards ─── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      transition: var(--transition);
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow), var(--shadow); }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* ─── Pill / Badge ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .badge-ready    { background: rgba(108,99,255,.15); color: #a78bfa; }
    .badge-progress { background: rgba(243,156,18,.15); color: #f39c12; }
    .badge-done     { background: rgba(46,204,113,.15); color: #2ecc71; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: none; cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: .9rem; font-weight: 600;
      transition: var(--transition);
    }
    .btn-primary {
      background: linear-gradient(135deg, #6c63ff, #9b59b6);
      color: #fff;
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

    /* ─── Empty state ─── */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { color: var(--text); margin-bottom: 8px; }

    /* ─── Flash / toast ─── */
    .flash {
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: .9rem;
    }
    .flash-error { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-logo">🎓 Mynoo</div>
  {% block breadcrumb %}{% endblock %}
  <div class="topbar-right">{% block topbar_right %}{% endblock %}</div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
